# .github/workflows/build.yml
#
# Triggers:
#   push main   → CI check (cargo check + vite build，快速驗證，不打包)
#   push v* tag → 完整 Release build → 發佈 .exe
#   手動        → workflow_dispatch
#
# 日常開發：bash release.sh 自動 commit + tag + push，觸發 Release build。

name: Build Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build (Windows x64)
    runs-on: windows-latest

    steps:
      # ── 0. 環境快照 ──────────────────────────────────────────────────────────
      - name: Print environment info
        run: |
          Write-Host "=== Trigger ==="
          Write-Host "ref      : $env:GITHUB_REF"
          Write-Host "ref_name : $env:GITHUB_REF_NAME"
          Write-Host "sha      : $env:GITHUB_SHA"
          Write-Host "=== Runner OS ==="
          Write-Host "$([System.Environment]::OSVersion.VersionString)"

      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node.js 22 ────────────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package-lock.json

      # ── 3. Rust stable (MSVC) ────────────────────────────────────────────────
      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Print tool versions
        run: |
          Write-Host "node  $(node --version)"
          Write-Host "npm   $(npm --version)"
          Write-Host "rustc $(rustc --version)"
          Write-Host "cargo $(cargo --version)"
          cmake --version | Select-Object -First 1

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # ── 4. npm install ────────────────────────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── 5. Vite build（前端 TS 型別也在這裡檢查）─────────────────────────────
      - name: Vite build
        run: npm run build

      # ── 6. Cargo check（所有 push 都跑，比 build 快 3-5x，錯誤一眼清楚）──────
      #   --message-format json-diagnostic-rendered-ansi → 保留顏色 + 完整 span
      - name: Cargo check
        run: |
          cargo check `
            --manifest-path src-tauri/Cargo.toml `
            --target x86_64-pc-windows-msvc `
            --message-format short 2>&1

      # ── 7. Release build + publish（只在 tag push 時執行）────────────────────
      #   cargo check 通過才到這步，所以 tauri-action 失敗一定是打包問題而非 Rust
      - name: Build & Release Tauri (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "richness-win11 ${{ github.ref_name }}"
          releaseBody: |
            ## Hardware Communication Tool — ${{ github.ref_name }}

            ### 下載安裝
            執行 `richness-win11_x.y.z_x64-setup.exe`（Windows 11, per-user 安裝）

            ### USB 首次設定
            用 **Zadig** 將目標 USB 設備驅動切換為 WinUSB，詳見 howto.md
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
