# .github/workflows/build.yml
# Builds a Windows 11 NSIS installer on every version tag (v*).
# The resulting .exe is published as a GitHub Release asset.
# Trigger manually via workflow_dispatch if needed.

name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    name: Build (Windows x64)
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: "npm" requires package-lock.json — always present after first npm install
          cache: "npm"
          cache-dependency-path: package-lock.json

      # ── 3. Rust (stable, MSVC target) ────────────────────────────────────
      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Cache Cargo registry + build artefacts
      # Cargo.lock is auto-generated on first build; fall back to registry cache
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ── 4. libusb via vcpkg (required by rusb vendored feature) ──────────
      # windows-latest already has vcpkg at C:\vcpkg
      # rusb uses "vendored" feature (compiles libusb from source via cmake),
      # but we set LIBUSB env vars as fallback for any dynamic linking path.
      - name: Install libusb via vcpkg
        run: |
          vcpkg integrate install
          vcpkg install libusb:x64-windows-static
          Add-Content $env:GITHUB_ENV "LIBUSB_DIR=C:\vcpkg\installed\x64-windows-static"
          Add-Content $env:GITHUB_ENV "VCPKG_ROOT=C:\vcpkg"

      # ── 5. Install npm dependencies ──────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── 6. Build Tauri app ───────────────────────────────────────────────
      - name: Build Tauri (release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri signing — skip for open-source / demo
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "richness-win11 ${{ github.ref_name }}"
          releaseBody: |
            ## Hardware Communication Tool — ${{ github.ref_name }}

            ### Download
            Install `richness-win11_x.y.z_x64-setup.exe` on Windows 11.

            ### First-time USB setup
            Run **Zadig** to install WinUSB/libusb driver for your USB device
            before connecting via the USB panel.
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
