# .github/workflows/build.yml

name: Build Windows Installer

on:
  push:
    branches: [main]
    tags:     ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build (Windows x64)
    runs-on: windows-latest

    steps:
      # ── 0. 環境快照 ──────────────────────────────────────────────────────────
      - name: Print environment info
        run: |
          Write-Host "ref: $env:GITHUB_REF  sha: $env:GITHUB_SHA"
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"

      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node.js 22 ────────────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package-lock.json

      # ── 3. Rust stable ───────────────────────────────────────────────────────
      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Print versions
        run: |
          Write-Host "node  $(node --version)"
          Write-Host "npm   $(npm --version)"
          Write-Host "rustc $(rustc --version)"
          Write-Host "cargo $(cargo --version)"
          cmake --version | Select-Object -First 1

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # ── 4. npm ───────────────────────────────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── 5. Vite build ────────────────────────────────────────────────────────
      - name: Vite build (tsc + vite)
        run: npm run build

      # ── 6. Cargo check — 所有 push 都跑，錯誤清楚顯示 ────────────────────────
      # rusb vendored 自帶 libusb 源碼，cmake 自動編，不需 vcpkg
      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --message-format short

      # ── 7. Release (tag only) ─────────────────────────────────────────────────
      - name: Build & Release Tauri
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "richness-win11 ${{ github.ref_name }}"
          releaseBody: |
            ## Hardware Communication Tool — ${{ github.ref_name }}
            執行 `richness-win11_x.y.z_x64-setup.exe`（Windows 11）
            USB 首次設定：用 Zadig 將目標設備驅動切換為 WinUSB
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
