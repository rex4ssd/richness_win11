# .github/workflows/build.yml
#
# Triggers:
#   push main   → CI build only (驗證能編過，不發 Release)
#   push v* tag → CI build + 發佈 GitHub Release (.exe 安裝檔)
#   手動        → workflow_dispatch
#
# 日常開發：bash release.sh 就會自動 commit + tag + push，觸發 Release build。

name: Build Windows Installer

on:
  push:
    branches:
      - main          # 每次 push main：只跑 CI，不發 Release
    tags:
      - "v*"          # 打版本 tag：CI + 發佈 Release
  workflow_dispatch:  # 手動觸發

# 避免同一 branch 同時跑多個 workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build (Windows x64)
    runs-on: windows-latest

    steps:
      # ── 0. 環境資訊（出錯時第一眼就知道版本）───────────────────────────────
      - name: Print environment info
        run: |
          Write-Host "=== Trigger ==="
          Write-Host "ref      : $env:GITHUB_REF"
          Write-Host "ref_name : $env:GITHUB_REF_NAME"
          Write-Host "sha      : $env:GITHUB_SHA"
          Write-Host ""
          Write-Host "=== Runner ==="
          Write-Host "OS       : $([System.Environment]::OSVersion.VersionString)"
          Write-Host "CPU      : $env:PROCESSOR_ARCHITECTURE"
          Write-Host ""
          Write-Host "=== Tools (pre-installed) ==="
          node  --version 2>$null || Write-Host "node  : not found"
          npm   --version 2>$null || Write-Host "npm   : not found"
          rustc --version 2>$null || Write-Host "rustc : not found"
          cargo --version 2>$null || Write-Host "cargo : not found"
          cmake --version 2>$null | Select-Object -First 1 || Write-Host "cmake : not found"

      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22          # Node 22 LTS（Node 20 將於 2026-09 移除）
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Print Node / npm version
        run: |
          node --version
          npm  --version

      # ── 3. Rust (stable, MSVC target) ────────────────────────────────────
      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Print Rust / Cargo version
        run: |
          rustc --version
          cargo --version
          rustup show

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ── 4. npm install ────────────────────────────────────────────────────
      # rusb 使用 vendored feature，libusb 自動從源碼編譯（需 cmake，runner 已內建）
      - name: Install npm dependencies
        run: npm ci

      # ── 5. Validate tauri.conf.json schema (快速失敗，不用等全量 build) ──
      - name: Validate tauri config
        run: npx @tauri-apps/cli info
        continue-on-error: true   # 只印資訊，schema 錯誤讓後面 build 步驟明確報

      # ── 6a. CI-only build (push main，非 tag) ─────────────────────────────
      #   cargo check 比 cargo build 快 3-5x；--message-format=short 讓錯誤一眼清楚
      - name: Vite build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run build

      - name: Cargo check (non-tag push)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: >
          cargo check
          --manifest-path src-tauri/Cargo.toml
          --target x86_64-pc-windows-msvc
          --message-format short

      # ── 6b. Release build (tag push) ──────────────────────────────────────
      - name: Build & Release Tauri (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "richness-win11 ${{ github.ref_name }}"
          releaseBody: |
            ## Hardware Communication Tool — ${{ github.ref_name }}

            ### 下載安裝
            執行 `richness-win11_x.y.z_x64-setup.exe`（Windows 11, per-user 安裝）

            ### USB 首次設定
            用 **Zadig** 將目標 USB 設備驅動切換為 WinUSB，詳見 howto.md
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
